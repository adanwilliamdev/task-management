spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow_notification}
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8084
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:taskflowSecretKeyForJwtTokenGenerationWith256BitsLength}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.taskflow: ${LOG_LEVEL:INFO}
