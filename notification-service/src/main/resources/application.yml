spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://postgres:5432/taskflow_notification
    username: taskflow
    password: taskflow123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
server:
  port: 8084
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
app:
  jwt:
    secret: "taskflowSecretKeyForJwtTokenGenerationWith256BitsLength"
logging:
  level:
    com.taskflow: DEBUG
